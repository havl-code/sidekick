[project]
name = "sidekick"
version = "0.1.0"
description = "A personal co-worker agent with a browser, web search and a sandbox, behind a custom web UI"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "langchain>=1.3.4",
    "langchain-community>=0.4.2",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.4",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "wikipedia>=1.4.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
